<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Explore — STMDeskly</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; max-width: 100%;
    overflow-x: clip;
    background: #F7F6F1;
    color: #172B3A;
  }
  body {
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; height: auto; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.04em; }
  .explore-shell { width: 100%; max-width: 620px; margin: 0 auto; padding: 0 18px 112px; }
  .topbar { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="preload" as="style" href="tokens.css?v=1">
<link rel="preload" as="style" href="explore.css?v=2">
<link rel="preload" as="style" href="nav.css?v=4">

<link rel="stylesheet" href="tokens.css?v=1">
<link rel="stylesheet" href="explore.css?v=2">
<link rel="stylesheet" href="nav.css?v=4">
</head>

<body class="page-explore stm-nav-page">

<div class="explore-shell">

<header class="topbar">
  <a class="wordmark" href="/home.html" aria-label="STMDeskly home">STMDeskly</a>
  <span class="topbar-label">Explore</span>
</header>

<main>

  <section class="explore-hero">
    <h1>Find anyone. Find anything.</h1>
    <p>Desks, gigs, deals, skills — all in one search.</p>
  </section>

  <div class="explore-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </svg>
    <input
      type="search"
      id="exploreQuery"
      placeholder="Try: photographer, Lagos, jollof, phone repair…"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false">
    <button type="button" id="clearQuery" class="explore-clear" aria-label="Clear" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6L18 18M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <nav class="explore-filters" id="exploreFilters" aria-label="Filter results">
    <button type="button" class="explore-chip is-current" data-filter="all" aria-pressed="true">
      <span>All</span>
    </button>
    <button type="button" class="explore-chip" data-filter="desk" aria-pressed="false">
      <span>Desks</span>
    </button>
    <button type="button" class="explore-chip" data-filter="post" aria-pressed="false">
      <span>Posts</span>
    </button>
  </nav>

  <div class="explore-results" id="exploreResults">
    <div class="explore-empty" id="exploreEmpty" hidden>
      <span class="explore-empty-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <h2>Nothing here yet.</h2>
      <p>Try a different word. Or a name. Or a city.</p>
    </div>
  </div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=23"></script>
<script src="explore.js?v=2"></script>
<script src="nav.js?v=101"></script>

<script>
/* Topbar scroll behaviour — match Home */
(function () {
  var topbar = document.querySelector('.topbar');
  if (!topbar) return;

  function getScrollY() {
    return Math.max(
      window.scrollY || 0,
      window.pageYOffset || 0,
      document.documentElement ? document.documentElement.scrollTop : 0,
      document.body ? document.body.scrollTop : 0
    );
  }

  var lastY = getScrollY();
  var ticking = false;
  var HIDE_AFTER = 24;
  var SHOW_AFTER = 2;

  function update() {
    var y = getScrollY();
    var dy = y - lastY;

    if (dy > SHOW_AFTER && y > HIDE_AFTER) {
      topbar.classList.add('is-hidden');
      topbar.classList.remove('is-visible');
    } else if (dy < -SHOW_AFTER) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    if (y <= 4) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    lastY = y;
    ticking = false;
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  document.addEventListener('scroll', onScroll, { passive: true, capture: true });
})();
</script>

</body>
</html>
