<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Home — STMDeskly</title>

<style>
  /* Critical inline CSS — prevents the oversized flash before stylesheets load */
  html, body { margin: 0; padding: 0; background: #F7F6F1; color: #172B3A; }
  body {
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.04em; }
  .app-shell { width: 100%; max-width: 620px; margin: 0 auto; padding: 0 18px 112px; }
  .topbar { min-height: 52px; display: flex; align-items: center; justify-content: space-between; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="preload" as="style" href="tokens.css?v=1">
<link rel="preload" as="style" href="feed.css?v=3">
<link rel="preload" as="style" href="nav.css?v=3">

<link rel="stylesheet" href="tokens.css?v=1">
<link rel="stylesheet" href="feed.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
</head>

<body>

<div class="app-shell">

<header class="topbar">
  <a class="wordmark" href="/home.html" aria-label="STMDeskly home">STMDeskly</a>
  <div class="top-actions">
    <button class="icon-button" id="searchButton" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
    <button class="icon-button notice" id="notificationsButton" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      <i></i>
    </button>
    <a class="avatar-button" href="/settings.html" aria-label="Account and settings">
      <span class="avatar" id="userAvatar">·</span>
    </a>
  </div>
</header>

<main>

<section class="welcome">
  <p class="eyebrow">Your community</p>
  <h1 id="greeting">Hi there<span>.</span></h1>
  <p>Find opportunities. Share your skills. Grow together.</p>
</section>

<nav class="category-scroll" id="categoryNav" aria-label="Filter posts">
  <button class="filter-chip active" data-category="all" aria-pressed="true">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
    All
  </button>
  <button class="filter-chip" data-category="gig" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>
    Gigs
  </button>
  <button class="filter-chip" data-category="deal" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M20 13 12 21 3 12l9-9h8z"/><circle cx="16" cy="8" r="1"/></svg>
    Market deals
  </button>
  <button class="filter-chip" data-category="business" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2m2 0h2M9 11h2m2 0h2M10 21v-5h4v5"/></svg>
    Business
  </button>
  <button class="filter-chip" data-category="skill" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1zM16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1h-4"/></svg>
    Skills &amp; work
  </button>
</nav>

<a class="composer" href="/new-post.html">
  <span class="avatar composer-avatar" id="composerAvatar">·</span>
  <span class="composer-prompt">What's on your mind?</span>
  <span class="composer-button">
    <svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.2-.9L19 8.3a2.1 2.1 0 0 0-3-3L5.2 16.1 4 20Z"/></svg>
    New post
  </span>
</a>

<section class="feed" id="feed" aria-label="Latest posts">
  <div class="feed-loading" id="feedLoading">Loading…</div>
  <div class="feed-empty" id="feedEmpty" hidden>
    No posts yet. Be the first to share something.
  </div>
</section>

</main>

</div>

<div class="sheet-overlay" id="commentOverlay" hidden>
  <div class="sheet" id="commentSheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <header class="sheet-head">
      <span id="sheetTitle">Replies</span>
      <button type="button" id="sheetClose" aria-label="Close">×</button>
    </header>
    <div class="sheet-body" id="sheetBody">
      <div class="sheet-post" id="sheetPost"></div>
      <div class="sheet-replies" id="sheetReplies"></div>
    </div>
    <form class="sheet-composer" id="sheetComposer">
      <input type="text" id="sheetInput" placeholder="Write a reply…" maxlength="500" autocomplete="off">
      <button type="submit" id="sheetSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=23"></script>
<script src="home.js?v=6"></script>
<script src="nav.js?v=101"></script>

</body>
</html>
