<script>
/* ---------- Wordmark → live clock swap ---------- */
(function () {
  var nameEl  = document.getElementById('wmName');
  var clockEl = document.getElementById('wmClock');
  if (!nameEl || !clockEl) return;

  var swapped = false;

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    clockEl.textContent =
      (h12 < 10 ? '0' : '') + h12 + ':' +
      (m < 10 ? '0' : '') + m + ':' +
      (s < 10 ? '0' : '') + s + ' ' + ampm;
  }

  function swap() {
    if (swapped) return;
    swapped = true;
    nameEl.classList.add('is-out');
    clockEl.classList.add('is-in');
    tick();
    setInterval(tick, 1000);
  }

  setTimeout(swap, 1200);
})();

/* ---------- Topbar actions ---------- */
(function () {
  var searchBtn = document.getElementById('searchButton');
  var bellBtn   = document.getElementById('notificationsButton');

  if (searchBtn) {
    searchBtn.addEventListener('click', function () {
      location.href = '/explore.html';
    });
  }

  if (bellBtn) {
    bellBtn.addEventListener('click', function () {
      location.href = '/notifications';
    });
  }
})();

/* ---------- Topbar scroll-hide — transform only ---------- */
(function () {
  var topbar = document.querySelector('.topbar');
  if (!topbar) return;

  function getY() {
    return Math.max(
      window.scrollY || 0,
      window.pageYOffset || 0,
      document.documentElement ? document.documentElement.scrollTop : 0,
      document.body ? document.body.scrollTop : 0
    );
  }

  var lastY = getY();
  var ticking = false;
  var HIDE_AFTER = 24;

  function update() {
    var y = getY();
    var dy = y - lastY;

    if (dy > 2 && y > HIDE_AFTER) {
      topbar.classList.add('is-hidden');
      topbar.classList.remove('is-visible');
    } else if (dy < -2) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    if (y <= 4) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    lastY = y;
    ticking = false;
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  document.addEventListener('scroll', onScroll, { passive: true, capture: true });
})();

/* ---------- Greeting — show on arrival, retire for the session ---------- */
(function () {
  var w = document.getElementById('welcome');
  if (!w) return;

  var KEY = 'stm_greeting_shown';
  var already = false;
  try { already = sessionStorage.getItem(KEY) === '1'; } catch (e) {}

  if (already) {
    w.style.display = 'none';
    return;
  }

  setTimeout(function () {
    w.classList.add('is-leaving');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }, 2600);

  w.addEventListener('transitionend', function (e) {
    if (e.propertyName === 'max-height' || e.propertyName === 'opacity') {
      w.style.display = 'none';
    }
  });
})();

/* ---------- Notifications bell dot ---------- */
(function () {
  var btn = document.getElementById('notificationsButton');
  if (!btn) return;

  (async function paintDot() {
    if (!window.AUTH) return;

    var user = await AUTH.currentUser();
    if (!user) return;

    var lastSeen = await AUTH.getLastSeenNotificationsAt();
    var lastSeenMs = lastSeen ? new Date(lastSeen).getTime() : 0;

    var res = await AUTH.getNotifications();
    if (!res.ok) return;

    var d = res.data || {};
    var hasNew = false;

    function scan(list) {
      if (hasNew || !list) return;
      for (var i = 0; i < list.length; i++) {
        if (new Date(list[i].created_at).getTime() > lastSeenMs) {
          hasNew = true;
          return;
        }
      }
    }

    scan(d.chatRequests);
    scan(d.likes);
    scan(d.replies);

    if (hasNew) btn.classList.add('notice');
  })();
})();
</script>

</body>
