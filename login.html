<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F1">

  <title>Log in — STMDeskly</title>
  <meta name="description" content="Log in to your STMDeskly account and access your Desk.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=8">
  <link rel="stylesheet" href="auth.css?v=2">
</head>

<body class="page-auth">

  <!-- Header -->
  <header class="auth-topbar">
    <a href="/" class="auth-brand" aria-label="STMDeskly home">
      <img src="assets/images/deskly-logo-v2.png" alt="">
      <span>STMDeskly</span>
    </a>

    <a href="/" class="auth-topbar-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18L9 12L15 6" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Back to home</span>
    </a>
  </header>

  <!-- Login -->
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="loginTitle">

      <div class="auth-heading">
        <span class="auth-eyebrow">YOUR DESK IS WAITING</span>
        <h1 class="auth-title" id="loginTitle">Welcome back.</h1>
        <p class="auth-sub">
          Log in to your Desk and pick up where you left off.
        </p>
      </div>

      <div class="auth-error" id="formError" role="alert" aria-live="polite" hidden></div>

      <button type="button" class="auth-google" id="googleBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="auth-google-icon">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider"><span>or log in with email</span></div>

      <form id="loginForm" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="email">Email address</label>
          <input class="auth-input" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email"
                 autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="auth-label" for="password">Password</label>
          </div>
          <div class="auth-pw-wrap">
            <input class="auth-input" type="password" id="password" name="password"
                   placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="auth-pw-toggle reveal-btn" id="pwToggle"
                    aria-label="Reveal password" aria-pressed="false">Reveal</button>
          </div>
        </div>

        <div class="auth-options">
          <label class="auth-remember">
            <input type="checkbox" id="remember" name="remember" checked>
            <span>Remember me</span>
          </label>
          <a href="/forgot.html" class="auth-forgot">Forgot password?</a>
        </div>

        <!-- Turnstile widget -->
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAFVDiwAnKoWmrKoj"
             data-theme="light"
             data-size="flexible"
             style="margin-bottom: 16px;"></div>

        <button type="submit" class="auth-submit" id="submitBtn">
          <span>Log in</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12H19M12 5L19 12L12 19" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="auth-foot">
        Don't have a Desk? <a href="/signup.html">Create one</a>
      </p>
    </section>

    <p class="auth-bottom-note">Your own place on the internet.</p>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="/theme.js"></script>

  <script>
    (function () {
      'use strict';

      const $ = function (id) { return document.getElementById(id); };

      const formError = $('formError');
      const loginForm = $('loginForm');
      const submitBtn = $('submitBtn');
      const submitText = submitBtn.querySelector('span');
      const googleBtn = $('googleBtn');
      const pwToggle = $('pwToggle');

      let isSubmitting = false;

      function showError(message) {
        formError.textContent = message;
        formError.hidden = false;
      }
      function clearError() {
        formError.textContent = '';
        formError.hidden = true;
      }
      function setLoading(loading) {
        isSubmitting = loading;
        submitBtn.disabled = loading;
        googleBtn.disabled = loading;
        submitText.textContent = loading ? 'Logging in...' : 'Log in';
        submitBtn.setAttribute('aria-busy', String(loading));
      }

      // Turnstile helpers
      function getTurnstileToken() {
        const el = document.querySelector('[name="cf-turnstile-response"]');
        return el ? el.value : null;
      }
      function resetTurnstile() {
        if (window.turnstile && window.turnstile.reset) {
          try { window.turnstile.reset(); } catch (e) {}
        }
      }

      // Redirect an existing signed-in user to the right place.
      (async function checkSession() {
        try {
          const user = await AUTH.currentUser();
          if (!user) return;

          const desk = await AUTH.currentDesk();

          if (desk) {
            window.location.replace('/dashboard.html');
          } else {
            window.location.replace('/signup.html');
          }
        } catch (error) {
          console.error('Session check failed:', error);
        }
      })();

      // Google sign-in.
      googleBtn.addEventListener('click', async function () {
        if (isSubmitting) return;
        clearError();
        googleBtn.disabled = true;

        try {
          const result = await AUTH.signInGoogle(
            window.location.origin + '/login.html'
          );
          if (!result || !result.ok) {
            showError('Could not start Google sign-in. Please try again.');
            googleBtn.disabled = false;
          }
        } catch (error) {
          console.error('Google sign-in failed:', error);
          showError('Could not start Google sign-in. Please try again.');
          googleBtn.disabled = false;
        }
      });

      // Reveal / hide password.
      pwToggle.addEventListener('click', function () {
        const passwordInput = $('password');
        const isRevealed = passwordInput.type === 'text';
        passwordInput.type = isRevealed ? 'password' : 'text';
        this.textContent = isRevealed ? 'Reveal' : 'Hide';
        this.setAttribute('aria-label', isRevealed ? 'Reveal password' : 'Hide password');
        this.setAttribute('aria-pressed', String(!isRevealed));
      });

      // Email + password login.
      loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (isSubmitting) return;
        clearError();

        const email = $('email').value.trim();
        const password = $('password').value;

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Please enter a valid email address.');
          return;
        }
        if (!AUTH.rlCheck('login', 5, 15 * 60 * 1000)) {
          showError('Too many attempts. Try again in a few minutes.');
          return;
        }

        const turnstileToken = getTurnstileToken();
        if (!turnstileToken) {
          showError('Please complete the verification check.');
          return;
        }

        setLoading(true);

        try {
          AUTH.rlRecord('login', 15 * 60 * 1000);

          const result = await AUTH.loginEmail({ email, password });
          if (!result || !result.ok) {
            resetTurnstile();
            showError('Email or password is incorrect.');
            return;
          }

          const desk = await AUTH.currentDesk();
          window.location.replace(desk ? '/dashboard.html' : '/signup.html');

        } catch (error) {
          console.error('Login failed:', error);
          resetTurnstile();
          showError('Something went wrong. Please try again.');
        } finally {
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
