<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Chats — STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="chats.css?v=3">
<link rel="stylesheet" href="nav.css?v=2">
</head>

<body class="page-chats">

<header class="chats-header">
  <div class="chats-header-row">
    <h1 class="chats-title">
      Chats
      <span class="chats-total" id="chatsTotal" hidden></span>
    </h1>
    <a class="chats-new" href="/new-chat.html" aria-label="Find someone to chat with">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </a>
  </div>

  <div class="chats-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </svg>
    <input
      type="search"
      id="chatsSearch"
      placeholder="Search chats"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false">
    <button type="button" id="chatsClear" class="chats-search-clear" aria-label="Clear" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6L18 18M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <nav class="chats-tabs" id="chatsTabs" aria-label="Filter">
    <button type="button" class="chats-tab is-current" data-tab="all" aria-pressed="true">All</button>
    <button type="button" class="chats-tab" data-tab="unread" aria-pressed="false">
      Unread
      <span class="chats-tab-count" id="tabCountUnread" hidden></span>
    </button>
    <button type="button" class="chats-tab" data-tab="requests" aria-pressed="false">
      Requests
      <span class="chats-tab-count" id="tabCountRequests" hidden></span>
    </button>
  </nav>
</header>

<main class="chats-list" id="chatsList">
  <div class="chats-loading" id="chatsLoading">
    <span class="chats-loading-dot"></span>
    <span class="chats-loading-dot"></span>
    <span class="chats-loading-dot"></span>
  </div>

  <div class="chats-empty" id="chatsEmpty" hidden>
    <span class="chats-empty-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5l-3 2-3-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
      </svg>
    </span>
    <h2 id="chatsEmptyTitle">No chats yet</h2>
    <p id="chatsEmptyBody">Tap the + button to find someone to chat with.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=10"></script>
<script src="chats.js?v=3"></script>
<script src="nav.js?v=99"></script>

</body>
</html>
