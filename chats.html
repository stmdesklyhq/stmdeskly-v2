<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Chats — STMDeskly</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; max-width: 100%;
    overflow-x: clip;
    background: #F7F6F1;
    color: #172B3A;
  }
  body {
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; height: auto; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -0.04em; }
  .chats-shell { width: 100%; max-width: 620px; margin: 0 auto; padding: 0 18px 112px; }
  .topbar { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="preload" as="style" href="tokens.css?v=1">
<link rel="preload" as="style" href="type.css?v=1">
<link rel="preload" as="style" href="chats.css?v=4">
<link rel="preload" as="style" href="nav.css?v=4">

<link rel="stylesheet" href="tokens.css?v=1">
<link rel="stylesheet" href="type.css?v=1">
<link rel="stylesheet" href="chats.css?v=4">
<link rel="stylesheet" href="nav.css?v=4">
</head>

<body class="page-chats stm-nav-page">

<div class="chats-shell">

<header class="topbar">
  <a class="wordmark" href="/home" aria-label="STMDeskly home">STMDeskly</a>
  <a class="topbar-action" href="/new-chat.html" aria-label="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </a>
</header>

<main>

<section class="chats-head">
  <h1>Chats <span class="chats-total" id="chatsTotal" hidden>0</span></h1>
</section>

<div class="chats-search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/>
    <path d="M21 21l-4.35-4.35"/>
  </svg>
  <input type="search" id="chatsSearch" placeholder="Search chats" autocomplete="off">
  <button type="button" class="chats-search-clear" id="chatsClear" aria-label="Clear" hidden>×</button>
</div>

<nav class="chats-tabs" id="chatsTabs" aria-label="Filter chats">
  <button type="button" class="chats-tab is-current" data-tab="all" aria-pressed="true">All</button>
  <button type="button" class="chats-tab" data-tab="unread" aria-pressed="false">
    Unread <span class="chats-tab-badge" id="tabCountUnread" hidden>0</span>
  </button>
  <button type="button" class="chats-tab" data-tab="requests" aria-pressed="false">
    Requests <span class="chats-tab-badge" id="tabCountRequests" hidden>0</span>
  </button>
  <button type="button" class="chats-tab" data-tab="archived" aria-pressed="false">Archived</button>
</nav>

<div class="chats-loading" id="chatsLoading">
  <div class="chats-loading-row"></div>
  <div class="chats-loading-row"></div>
  <div class="chats-loading-row"></div>
</div>

<div class="chats-empty" id="chatsEmpty" hidden>
  <span class="chats-empty-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </span>
  <h2 id="chatsEmptyTitle">No chats yet</h2>
  <p id="chatsEmptyBody">Find someone on Explore and tap Chat on their profile.</p>
</div>

<div class="chats-list" id="chatsList"></div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=33"></script>
<script src="chats.js?v=6"></script>
<script src="nav.js?v=101"></script>

<script>
/* Topbar scroll behaviour */
(function () {
  var topbar = document.querySelector('.topbar');
  if (!topbar) return;

  function getScrollY() {
    return Math.max(
      window.scrollY || 0,
      window.pageYOffset || 0,
      document.documentElement ? document.documentElement.scrollTop : 0,
      document.body ? document.body.scrollTop : 0
    );
  }

  var lastY = getScrollY();
  var ticking = false;

  function update() {
    var y = getScrollY();
    var dy = y - lastY;

    if (dy > 2 && y > 24) {
      topbar.classList.add('is-hidden');
      topbar.classList.remove('is-visible');
    } else if (dy < -2) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    if (y <= 4) {
      topbar.classList.remove('is-hidden');
      topbar.classList.add('is-visible');
    }

    lastY = y;
    ticking = false;
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  document.addEventListener('scroll', onScroll, { passive: true, capture: true });
})();
</script>

</body>
</html>
