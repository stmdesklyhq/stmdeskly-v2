<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Chat — STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="chat.css?v=18">
</head>

<body class="page-chat">

<header class="chat-topbar">
  <a class="chat-back" href="/chats.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>

  <a class="chat-head" id="chatHead" href="#">
    <span class="chat-avatar-wrap">
      <span class="chat-avatar" id="chatAvatar">·</span>
      <span class="chat-presence" id="chatPresence" hidden></span>
    </span>
    <span class="chat-head-copy">
      <span class="chat-name-row">
        <span class="chat-name" id="chatName">Loading…</span>
        <span class="chat-mute-icon" id="chatMuteIcon" hidden aria-label="Muted">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            <path d="M18.63 13A17.89 17.89 0 0 1 18 8"/>
            <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/>
            <path d="M18 8a6 6 0 0 0-9.33-5"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        </span>
      </span>
      <span class="chat-status" id="chatStatus"></span>
    </span>
  </a>

  <button class="chat-menu" id="chatSearchBtn" type="button" aria-label="Search messages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35"/>
    </svg>
  </button>

  <button class="chat-menu" id="chatMenu" type="button" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="5" r="1"/>
      <circle cx="12" cy="12" r="1"/>
      <circle cx="12" cy="19" r="1"/>
    </svg>
  </button>
</header>

<div class="chat-menu-panel" id="chatMenuPanel" hidden>
  <a id="menuViewProfile" href="#" class="chat-menu-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
    </svg>
    <span>View profile</span>
  </a>

  <a id="menuOpenDesk" href="#" class="chat-menu-item" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h6v6M20 4l-9 9"/>
      <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
    </svg>
    <span>Open their Desk</span>
  </a>

  <button id="menuStarred" type="button" class="chat-menu-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.8l6.5-.9L12 3z"/>
    </svg>
    <span>Starred messages</span>
  </button>

  <button id="menuMute" type="button" class="chat-menu-item">
    <span id="menuMuteIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
    </span>
    <span id="menuMuteLabel">Mute notifications</span>
  </button>

  <button id="menuReport" type="button" class="chat-menu-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16v12H5.17L4 17.17V4z"/>
      <path d="M12 8v3M12 13v.5"/>
    </svg>
    <span>Report</span>
  </button>

  <button id="menuBlock" type="button" class="chat-menu-item danger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M5.6 5.6l12.8 12.8"/>
    </svg>
    <span id="menuBlockLabel">Block</span>
  </button>
</div>

<div class="chat-accept" id="acceptBar" hidden>
  <div class="chat-accept-copy">
    <strong>New message request</strong>
    <small>They'd like to chat with you.</small>
  </div>
  <div class="chat-accept-actions">
    <button type="button" class="chat-btn ghost" id="declineBtn">Decline</button>
    <button type="button" class="chat-btn primary" id="acceptBtn">Accept</button>
  </div>
</div>

<div class="chat-pending" id="pendingBar" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 2"/>
  </svg>
  <span>Waiting for them to accept your request.</span>
</div>

<div class="chat-missing" id="chatMissing" hidden>
  <span class="chat-missing-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v5M12 16v.01"/>
    </svg>
  </span>
  <h1>Conversation not found</h1>
  <p>It may have been deleted, or the link is wrong.</p>
  <a href="/chats.html" class="chat-missing-link">Back to Chats</a>
</div>

<main class="chat-log" id="chatLog" hidden></main>

<form class="chat-composer" id="chatComposer" hidden>
  <div class="chat-reply-bar" id="replyBar" hidden>
    <span class="chat-reply-stripe"></span>
    <div class="chat-reply-copy">
      <strong id="replyName"></strong>
      <span id="replyPreview"></span>
    </div>
    <button type="button" class="chat-reply-close" id="replyClose" aria-label="Cancel reply">×</button>
  </div>

  <div class="chat-composer-inner" id="composerInner">
    <button type="button" class="chat-attach" id="quickBtn" aria-label="Quick replies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </button>
    <button type="button" class="chat-attach" id="attachBtn" aria-label="Attach photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
    </button>
    <textarea id="chatInput" rows="1" placeholder="Message…" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
    <button type="submit" class="chat-send" id="sendBtn" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </button>
    <button type="button" class="chat-mic" id="micBtn" hidden aria-label="Hold to record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3M8 21h8"/>
      </svg>
    </button>
  </div>

  <div class="chat-recorder" id="chatRecorder" hidden>
    <button type="button" class="chat-rec-cancel" id="recCancel" aria-label="Cancel recording">×</button>
    <span class="chat-rec-dot"></span>
    <span class="chat-rec-timer" id="recTimer">0:00</span>
    <div class="chat-rec-wave" id="recWave" aria-hidden="true"></div>
    <button type="button" class="chat-rec-send" id="recSend" aria-label="Send voice note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <input type="file" id="photoInput" accept="image/*" hidden>
</form>

<div class="chat-blocked-banner" id="blockedBanner" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M5.6 5.6l12.8 12.8"/>
  </svg>
  <span id="blockedBannerText">You blocked this user.</span>
  <button type="button" class="chat-blocked-unblock" id="blockedUnblock">Unblock</button>
</div>

<div class="quick-sheet-overlay" id="quickOverlay" hidden>
  <div class="quick-sheet">
    <header class="quick-sheet-head">
      <span>Quick replies</span>
      <button type="button" id="quickClose" aria-label="Close">×</button>
    </header>

    <div class="quick-sheet-body" id="quickList"></div>

    <div class="quick-sheet-footer">
      <button type="button" class="quick-chip-action" id="quickDeskLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13.8a4.2 4.2 0 0 0 6.1.2l3-3a4.3 4.3 0 0 0-6.1-6.1l-1.7 1.7M14 10.2a4.2 4.2 0 0 0-6.1-.2l-3 3A4.3 4.3 0 0 0 11 19.1l1.7-1.7"/>
        </svg>
        Send my desk link
      </button>
      <button type="button" class="quick-chip-action" id="quickLocation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        Share my location
      </button>
    </div>

    <button type="button" class="quick-sheet-add" id="quickAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add a quick reply
    </button>
  </div>
</div>

<div class="chat-context" id="contextMenu" hidden>
  <div class="chat-context-emojis" id="contextEmojis"></div>
  <button type="button" class="chat-context-item" data-action="reply">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-6-6 6-6"/><path d="M3 11h13a6 6 0 0 1 6 6v3"/></svg>
    <span>Reply</span>
  </button>
  <button type="button" class="chat-context-item" data-action="star">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.8l6.5-.9L12 3z"/>
    </svg>
    <span id="starLabel">Star</span>
  </button>
  <button type="button" class="chat-context-item" data-action="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    <span>Copy</span>
  </button>
  <button type="button" class="chat-context-item danger" data-action="delete-me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
    <span>Delete for me</span>
  </button>
  <button type="button" class="chat-context-item danger" data-action="delete-all" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
    <span>Delete for everyone</span>
  </button>
</div>

<div class="search-overlay" id="searchOverlay" hidden>
  <header class="search-head">
    <button type="button" id="searchClose" aria-label="Close search">×</button>
    <input type="search" id="searchInput" placeholder="Search in this chat…" autocomplete="off">
    <span class="search-count" id="searchCount"></span>
  </header>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="starred-overlay" id="starredOverlay" hidden>
  <header class="starred-head">
    <button type="button" id="starredClose" aria-label="Close">×</button>
    <span>Starred messages</span>
  </header>
  <div class="starred-list" id="starredList"></div>
</div>

<div class="chat-lightbox" id="chatLightbox" hidden>
  <button type="button" class="chat-lightbox-close" id="chatLightboxClose" aria-label="Close">×</button>
  <img id="chatLightboxImg" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=23"></script>
<script src="chat.js?v=16"></script>

</body>
</html>
