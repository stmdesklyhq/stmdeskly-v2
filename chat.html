<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Inbox — STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=10">
<link rel="stylesheet" href="chats.css?v=1">
</head>

<body class="page-chats">

<header class="chats-topbar">
  <span class="chats-brand">STMDeskly</span>
  <span class="chats-label">Inbox</span>
</header>

<main class="chats-main">

  <!-- Filters -->
  <nav class="chats-filters" id="chatsFilters" aria-label="Filter conversations">
    <button type="button" class="chats-chip is-current" data-filter="all" aria-pressed="true">All</button>
    <button type="button" class="chats-chip" data-filter="inbox" aria-pressed="false">
      Inbox
      <span class="chats-chip-badge" id="inboxBadge" hidden></span>
    </button>
    <button type="button" class="chats-chip" data-filter="requests" aria-pressed="false">
      Requests
      <span class="chats-chip-badge" id="requestsBadge" hidden></span>
    </button>
  </nav>

  <!-- List -->
  <div class="chats-list" id="chatsList">
    <div class="chats-loading" id="chatsLoading">Loading conversations…</div>

    <div class="chats-empty" id="chatsEmpty" hidden>
      <span class="chats-empty-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5l-3 2-3-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
        </svg>
      </span>
      <h2 id="chatsEmptyTitle">No conversations yet.</h2>
      <p id="chatsEmptyBody">Open someone's profile and tap Chat to start one.</p>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=10"></script>
<script src="chats.js?v=1"></script>
<script src="nav.js?v=1"></script>

</body>
</html>
