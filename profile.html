<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Profile — STMDeskly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css?v=1">
<link rel="stylesheet" href="profile.css?v=1">
</head>

<body class="page-desk page-profile">

<div class="profile-topbar">
  <button type="button" class="profile-back" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="profile-topbar-title" id="topbarTitle"></span>
  <span class="profile-topbar-spacer"></span>
</div>

<!-- Loading -->
<div class="desk-loading" id="loading">
  <div class="desk-loading-dot"></div>
  <div class="desk-loading-dot"></div>
  <div class="desk-loading-dot"></div>
</div>

<!-- Missing -->
<div class="desk-missing" id="missing" hidden>
  <h1>Profile not found</h1>
  <p>This link doesn't point to a Desk yet.</p>
  <a href="/home.html" class="desk-missing-link">Back to home</a>
</div>

<!-- The profile -->
<main class="desk-shell" id="profileShell" hidden>

  <header class="desk-brand">
    <div class="desk-brand-inner">
      <div class="desk-mark" id="mark">·</div>
      <h1 class="desk-name" id="name"></h1>
      <p class="desk-role" id="role" hidden></p>
      <p class="desk-tagline" id="tagline" hidden></p>
      <button type="button" class="profile-message" id="messageBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span>Message</span>
      </button>
    </div>
  </header>

  <div class="desk-content" id="content"></div>

  <div class="profile-posts" id="profilePosts">
    <div class="profile-posts-head">
      <span>RECENT POSTS</span>
    </div>
    <div class="profile-posts-list" id="postsList"></div>
  </div>

  <footer class="desk-footer">
    <a href="/">
      <span class="desk-footer-dot"></span>
      Made with <strong>STMDeskly</strong>
    </a>
  </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=7"></script>
<script src="desk-render.js?v=1"></script>
<script src="profile.js?v=1"></script>
</body>
                                   </html>
