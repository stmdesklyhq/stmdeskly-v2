<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Profile — STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tokens.css?v=1">
<link rel="stylesheet" href="style.css?v=9">
<link rel="stylesheet" href="profile.css?v=4">
</head>

<body class="profile-page">

<header class="profile-topbar">
  <button type="button" class="profile-back" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="profile-topbar-title" id="profileTopTitle"></span>
  <button type="button" class="profile-share" id="shareBtn" aria-label="Share profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
      <path d="M16 6l-4-4-4 4"/>
      <path d="M12 2v14"/>
    </svg>
  </button>
</header>

<div class="profile-loading" id="loading">
  <div class="profile-loading-spinner" aria-hidden="true"></div>
  <p>Opening profile…</p>
</div>

<main class="profile-missing" id="missing" hidden>
  <div class="profile-missing-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v5M12 16v.01"/>
    </svg>
  </div>
  <h1>This profile isn't available</h1>
  <p>The person may have removed their Desk, or the link is wrong.</p>
  <a class="profile-missing-link" href="/home">Back to home</a>
</main>

<main class="profile" id="profile" hidden>

  <!-- Cover -->
  <div class="profile-cover" id="cover" aria-hidden="true"></div>

  <!-- Identity -->
  <section class="profile-identity">
    <div class="profile-avatar" id="mark" aria-hidden="true"></div>
    <div class="profile-identity-copy">
      <h1 class="profile-name" id="name"></h1>
      <p class="profile-role" id="role" hidden></p>
    </div>
  </section>

  <!-- Bio -->
  <p class="profile-bio" id="bio" hidden></p>

  <!-- Quick actions (contact icons) -->
  <div class="profile-actions" id="quickActions" hidden></div>

  <!-- Desk link card -->
  <div class="profile-desk-card" id="deskCard" hidden>
    <span class="profile-desk-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13.8a4.2 4.2 0 0 0 6.1.2l3-3a4.3 4.3 0 0 0-6.1-6.1l-1.7 1.7M14 10.2a4.2 4.2 0 0 0-6.1-.2l-3 3A4.3 4.3 0 0 0 11 19.1l1.7-1.7"/>
      </svg>
    </span>
    <div class="profile-desk-copy">
      <strong>Desk link</strong>
      <span id="deskLinkUrl">stmdeskly.com/u/username</span>
    </div>
    <button type="button" class="profile-desk-copy-btn" id="copyDeskLink" aria-label="Copy Desk link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="11" height="12" rx="2"/>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <!-- Work -->
  <section class="profile-section" id="workSection" hidden>
    <p class="profile-eyebrow">Work</p>
    <div class="profile-work" id="workGrid"></div>
  </section>

  <!-- About -->
  <section class="profile-section" id="aboutSection" hidden>
    <p class="profile-eyebrow">About</p>
    <p class="profile-about" id="aboutText"></p>
  </section>

  <!-- Services -->
  <section class="profile-section" id="servicesSection" hidden>
    <p class="profile-eyebrow">Services</p>
    <ul class="profile-services" id="servicesList"></ul>
  </section>

  <!-- Details -->
  <section class="profile-section" id="detailsSection" hidden>
    <p class="profile-eyebrow">Details</p>
    <div class="profile-details" id="detailsList"></div>
  </section>

  <!-- Contact -->
  <section class="profile-section" id="contactSection" hidden>
    <p class="profile-eyebrow">Contact</p>
    <div class="profile-contact" id="contactList"></div>
  </section>

  <!-- Recent posts -->
  <section class="profile-section" id="postsSection" hidden>
    <p class="profile-eyebrow">Recent posts</p>
    <div class="profile-posts" id="postsList"></div>
  </section>

  <footer class="profile-footer">
    Made with <strong>STMDeskly</strong>
  </footer>

</main>

<!-- Floating chat button -->
<button type="button" class="profile-chat-float" id="chatPill" hidden aria-label="Chat with this person">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span>Message</span>
</button>

<!-- Lightbox -->
<div class="profile-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="View image" hidden>
  <button type="button" class="profile-lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6L18 18M18 6L6 18"/>
    </svg>
  </button>
  <img id="lightboxImage" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=23"></script>
<script src="desk-render.js?v=4"></script>
<script src="profile.js?v=4"></script>

</body>
</html>
