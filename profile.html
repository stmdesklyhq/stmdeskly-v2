<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<title>Profile — STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=9">
<link rel="stylesheet" href="desk.css?v=20">
<link rel="stylesheet" href="profile.css?v=3">
</head>

<body class="public-desk-page profile-page">

<!-- Topbar with back -->
<header class="profile-topbar">
  <button type="button" class="profile-back" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="profile-title" id="profileTitle"></span>
  <span class="profile-spacer"></span>
</header>

<!-- Loading -->
<div class="desk-loading" id="loading">
  <div class="desk-loading-mark" aria-hidden="true"></div>
  <p>Opening this profile…</p>
</div>

<!-- Missing -->
<main class="desk-missing" id="missing" hidden>
  <div class="desk-missing-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v5M12 16v.01"/>
    </svg>
  </div>
  <p class="desk-overline">Profile</p>
  <h1>This profile isn't available</h1>
  <p class="desk-missing-description">The person may have deleted their Desk, or the link may be wrong.</p>
  <a class="desk-missing-link" href="/home.html">
    Back to home
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12H19M12 5L19 12L12 19"/>
    </svg>
  </a>
</main>

<!-- Profile -->
<main class="public-desk" id="desk" hidden>

  <!-- Hero -->
  <section class="desk-hero" aria-labelledby="name">
    <div class="desk-hero-cover" id="heroCover" aria-hidden="true"></div>

    <div class="desk-hero-card">
      <div class="desk-hero-avatar" id="mark" aria-label="Profile photo"></div>
      <div class="desk-hero-identity">
        <h1 id="name">Someone</h1>
        <p class="desk-role" id="role"></p>
      </div>
    </div>

    <p class="desk-tagline" id="tagline"></p>

    <nav class="profile-quicknav" id="quicknav" aria-label="Jump to section">
      <a class="profile-pill" href="#section-offer" id="pillOffer" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/></svg>
        <span>Portfolio</span>
      </a>
      <a class="profile-pill" href="#section-about" id="pillAbout" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l1 13H3L4 7Z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>
        <span>Services</span>
      </a>
      <a class="profile-pill" href="#section-contact" id="pillContact" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Contact</span>
      </a>
      <button type="button" class="profile-pill profile-pill--chat" id="chatPill" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>Chat</span>
      </button>
    </nav>
  </section>

  <!-- Content -->
  <div class="desk-content" id="content"></div>

  <!-- Recent posts -->
  <section class="profile-posts" id="profilePosts" hidden>
    <span class="desk-section-eyebrow">Recent posts</span>
    <div class="profile-posts-list" id="postsList"></div>
  </section>

</main>

<!-- Lightbox -->
<div class="desk-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="View image" hidden>
  <button class="desk-lightbox-close" id="lightboxClose" type="button" aria-label="Close image viewer">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <img id="lightboxImage" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=9"></script>
<script src="desk-render.js?v=4"></script>
<script src="profile.js?v=3"></script>

</body>
        </html>
